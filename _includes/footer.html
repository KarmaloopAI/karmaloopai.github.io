<footer>
    <div class="container">
        <div class="footer-grid">
            <div class="footer-column">
                <h3>{{ site.company.name }}</h3>
                <p>{{ site.description }}</p>
                <div class="social-links">
                    <a href="{{ site.company.social.github }}" target="_blank" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="{{ site.company.social.linkedin }}" target="_blank" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="{{ site.company.social.twitter }}" target="_blank" aria-label="Twitter">
                        <i class="fab fa-twitter"></i>
                    </a>
                </div>
            </div>
            
            <div class="footer-column">
                <h3>Agents</h3>
                <ul>
                    <li><a href="{{ site.baseurl }}/kai/">Kai</a></li>
                </ul>
            </div>
            
            <div class="footer-column">
                <h3>Company</h3>
                <ul>
                    <li><a href="{{ site.baseurl }}/contact/">Contact</a></li>
                </ul>
            </div>
            
            <div class="footer-column">
                <h3>Contact</h3>
                <p>US: {{ site.company.phone.us }}</p>
                <p>UK: {{ site.company.phone.uk }}</p>
                <p>Email: {{ site.email }}</p>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; {{ site.time | date: "%Y" }} {{ site.company.name }}. All Rights Reserved.</p>
        </div>
    </div>
</footer>
